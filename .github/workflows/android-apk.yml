name: Build Little Orbit APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-orbit-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Little Orbit — Latest Android APK
          body: 'Automatically built from the latest main branch. This is an unsigned debug APK intended for direct testing. Android may show an install warning because it is not distributed through Google Play.'
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          artifactContentType: application/vnd.android.package-archive
          artifactName: little-orbit.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
